<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>✧ My Anime Watch List ✧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    
  <h1><span>&lt;</span> Anime Watchlist <span>&gt;</span></h1>
  <p class="sub">Check off watched titles, leave a rating & add reviews.</p>
  
  <div class="bar"><i id="fill"></i></div>
  <div class="count" id="count"></div>

  <form class="add" id="addForm" onsubmit="return false">
    <input id="newTitle" type="text" placeholder="+ Add title..." aria-label="Title">
    <button type="submit">Add</button>
  </form>

  <div class="filter-bar">
    <input id="search" type="search" placeholder="🔍 Search list..." aria-label="Search">
    <select id="sortBy" aria-label="Sorteer lijst">
      <option value="default">Standaard volgorde</option>
      <option value="az">A-Z (Alfabetisch)</option>
      <option value="za">Z-A (Omgekeerd)</option>
      <option value="score-desc">Hoogste cijfer</option>
      <option value="score-asc">Laagste cijfer</option>
      <option value="has-review">Met review eerst</option>
    </select>
  </div>

  <div class="tools" id="tools">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="todo" aria-pressed="false">To Watch</button>
    <button data-f="seen" aria-pressed="false">Seen</button>
  </div>

  <ul id="list"></ul>
</main>

<script>
// Haal de ingelogde gebruiker op uit localStorage
var currentUser = JSON.parse(localStorage.getItem('currentUser'));
if (!currentUser) {
  // Als niemand is ingelogd, stuur terug naar login pagina
  window.location.href = 'login.html';
}

var items = [], filter = "all", query = "", openIds = {};

// 1. Data ophalen uit de database voor deze specifieke gebruiker
function load() {
  fetch('http://localhost:3000/api/watchlist/' + currentUser.id)
    .then(response => response.json())
    .then(data => {
      items = data.map(item => ({
        id: item.id,
        title: item.title,
        seen: item.seen === 1,
        score: item.score,
        review: item.review || ""
      }));
      render();
    })
    .catch(err => console.error('Fout bij laden:', err));
}

// 2. Wijziging doorgeven aan de database via PUT
function updateItemInDB(item) {
  fetch('http://localhost:3000/api/watchlist/' + item.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      seen: item.seen,
      score: item.score,
      review: item.review
    })
  })
  .catch(err => console.error('Fout bij bijwerken:', err));
}

function fmt(n){ return String(n).replace(".", ","); }

function update(){
  var seen = items.filter(function(f){return f.seen});
  var rated = items.filter(function(f){return typeof f.score==="number" && !isNaN(f.score)});
  var avg = rated.length ? rated.reduce(function(s,f){return s+f.score},0)/rated.length : null;
  document.getElementById("count").textContent = seen.length + " VAN " + items.length + " GEKEKEN" +
    (avg!==null ? " · GEMIDDELD: " + fmt(avg.toFixed(1)) : "");
  document.getElementById("fill").style.width = items.length ? (seen.length/items.length*100)+"%" : "0";
}

function render(){
  var ul = document.getElementById("list");
  ul.innerHTML = "";
  var q = query.toLowerCase();
  
  var shown = items.filter(function(f){
    var okF = filter==="all" || (filter==="seen"?f.seen:!f.seen);
    return okF && (f.title ? f.title.toLowerCase().indexOf(q) !== -1 : false);
  });

  var sortVal = document.getElementById("sortBy").value;
  shown.sort(function(a, b){
    if (sortVal === "az") return a.title.localeCompare(b.title);
    if (sortVal === "za") return b.title.localeCompare(a.title);
    if (sortVal === "score-desc") return (b.score || 0) - (a.score || 0);
    if (sortVal === "score-asc") return (a.score || 0) - (b.score || 0);
    if (sortVal === "has-review") return ((b.review && b.review.trim().length > 0) ? 1 : 0) - ((a.review && a.review.trim().length > 0) ? 1 : 0);
    return 0;
  });

  if(!shown.length) ul.innerHTML = '<li class="empty">[ NIETS GEVONDEN ]</li>';
  shown.forEach(function(f){
    var li = document.createElement("li");
    var isOpen = !!openIds[f.id];
    li.className = (f.seen?"seen ":"") + (isOpen?"open":"");
    var cid = "c"+f.id;
    li.innerHTML =
      '<div class="row"><input type="checkbox" id="'+cid+'"'+(f.seen?" checked":"")+'>'+
      '<label for="'+cid+'"></label>'+
      '<button class="note rv" type="button"></button>'+
      '<button class="note toggle-btn" type="button" title="In/Uitklappen">'+(isOpen ? "−" : "+")+'</button>'+
      '</div>'+
      '<div class="review">'+
        '<div class="rate"><label>CIJFER <input type="number" min="0" max="10" step="0.1" inputmode="decimal"></label><span>/ 10</span></div>'+
        '<textarea placeholder="Schrijf je review..." maxlength="600" aria-label="Review"></textarea>'+
        '<div class="review-footer">'+
          '<button class="note save-btn" type="button">Opslaan</button>'+
          '<details class="del-confirm">'+
            '<summary class="note del-trigger">Verwijderen</summary>'+
            '<div class="del-popover">'+
              '<span>Weet je zeker dat je het wilt verwijderen?</span>'+
              '<div class="del-actions">'+
                '<button class="note del confirm-yes" type="button">Ja</button>'+
                '<button class="note confirm-no" type="button">Nee</button>'+
              '</div>'+
            '</div>'+
          '</details>'+
        '</div>'+
      '</div>';

    li.querySelector("label").textContent = f.title;
    var rv = li.querySelector(".rv");
    var toggleBtn = li.querySelector(".toggle-btn");
    var num = li.querySelector("input[type=number]"), ta = li.querySelector("textarea");
    
    function badges(){
      var hasScore = typeof f.score === "number" && !isNaN(f.score);
      rv.innerHTML = hasScore 
        ? 'REVIEW <span class="badge-score">' + fmt(f.score) + ' ★</span>' 
        : 'REVIEW ✎';
    }
    
    badges();
    num.value = (typeof f.score==="number" && !isNaN(f.score)) ? f.score : "";
    ta.value = f.review || "";

    num.addEventListener("change", function(){
      var v = parseFloat(num.value.replace(",", "."));
      f.score = (isNaN(v) ? null : Math.min(10, Math.max(0, v)));
      updateItemInDB(f); badges(); update();
    });

    ta.addEventListener("change", function(){ 
      f.review = ta.value; 
      updateItemInDB(f); 
      badges(); 
    });

    li.querySelector("input[type=checkbox]").addEventListener("change", function(e){
      f.seen = e.target.checked; 
      if(f.seen) openIds[f.id] = true; 
      updateItemInDB(f); 
      render();
    });

    function toggleOpen(){
      openIds[f.id] = !openIds[f.id];
      li.classList.toggle("open");
      toggleBtn.textContent = openIds[f.id] ? "−" : "+";
      if(openIds[f.id]) ta.focus();
    }
    
    rv.addEventListener("click", toggleOpen);
    toggleBtn.addEventListener("click", toggleOpen);

    li.querySelector(".save-btn").addEventListener("click", function(){
      openIds[f.id] = false;
      li.classList.remove("open");
      toggleBtn.textContent = "+";
      updateItemInDB(f);
    });
    
    // Verwijderen uit de database én de lijst
    li.querySelector(".confirm-yes").addEventListener("click", function(){
      fetch('http://localhost:3000/api/watchlist/' + f.id, {
        method: 'DELETE'
      })
      .then(() => {
        load(); // Herlaad de lijst uit de database
      })
      .catch(err => console.error('Fout bij verwijderen:', err));
    });

    var delDetails = li.querySelector(".del-confirm");
    li.querySelector(".confirm-no").addEventListener("click", function(){
      delDetails.removeAttribute("open");
    });

    ul.appendChild(li);
  });
  update();
}

document.getElementById("tools").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  filter = b.getAttribute("data-f");
  Array.prototype.forEach.call(this.children,function(c){ c.setAttribute("aria-pressed", c===b); });
  render();
});

document.getElementById("search").addEventListener("input", function(e){ query = e.target.value; render(); });
document.getElementById("sortBy").addEventListener("change", function(){ render(); });

// 3. Anime toevoegen via API gekoppeld aan de user_id
document.getElementById("addForm").addEventListener("submit", function(){
  var inp = document.getElementById("newTitle"), t = inp.value.trim(); 
  if(!t) return;

  fetch('http://localhost:3000/api/watchlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: currentUser.id, title: t })
  })
  .then(res => res.json())
  .then(() => {
    inp.value = "";
    load(); // Ververs de lijst direct uit de database
  })
  .catch(err => console.error('Fout bij toevoegen:', err));
});

// Start de app door data in te laden
load();
</script>
</body>
</html>
